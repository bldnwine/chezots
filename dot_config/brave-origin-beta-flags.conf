# Native Wayland display protocol
--ozone-platform=wayland
--enable-wayland-ime

# Hardware Video Acceleration (Chromium 151+ VA-API flags)
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,VaapiIgnoreDriverChecks,TouchpadOverscrollHistoryNavigation,ParallelDownloading

# GPU Rasterization & Zero-Copy VRAM pipeline
--enable-gpu-rasterization
--enable-zero-copy
--ignore-gpu-blocklist

# Keyring / Secret Storage
--password-store=basic
